id: io.github.paintqt.Paint.QT
# org.gnome.Platform rather than org.kde.Platform. It is a rolling runtime with no
# version number, so the manifest cannot go stale: the KDE runtime is published per
# version and 6.7 no longer exists on Flathub, which is what broke the build with
# "Unable to find sdk org.kde.Sdk version 6.7". Neither runtime implies a desktop,
# so this does not tie the editor to GNOME.
runtime: org.gnome.Platform
sdk: org.gnome.Sdk
# No `base:`. It is derived from the runtime above; setting it to `app` is an
# invalid application id, since an app base name must contain at least two
# periods.

command: paint-qt

finish-args:
  # The palettes float inside the window, so no X11 or Wayland socket is needed
  # and nothing is granted beyond the default sandbox. Files the user picks are
  # reached through the GTK file dialog portal.
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

build-options:
  # rofiles-fuse is turned off from the command line rather than here: the
  # flatpak-builder shipped in org.flatpak.Builder rejects flatpak-builder-args
  # as an unknown property of BuilderOptions.
  append-path: /usr/lib/sdk/qt6/bin
  prepend-ld-library-path: /usr/lib/sdk/qt6/lib
  env:
    # Qt refuses to create a GL context on llvmpipe; software rendering is what
    # the sandbox has, so say so instead of letting it guess.
    QT_LOGGING_RULES: 'qt.qpa.xcb.warning=false'
    CMAKE_BUILD_PARALLEL_LEVEL: '4'

modules:
  - name: paint-qt
    buildsystem: simple
    build-commands:
      # The install prefix has to be /app. CMake defaults to /usr/local, which
      # would put the binary in /app/usr/local/bin and leave flatpak-builder
      # reporting "Command 'paint-qt' not found" after a build that otherwise
      # succeeded.
      - cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT_VERSION=6 -DCMAKE_INSTALL_PREFIX=/app
      - cmake --build build
      # The icons come from the SVG, rendered by the same rasteriser the icon
      # test compares against, so this target is part of the normal build.
      - cmake --build build --target pnq_icons_generated
      - cmake --install build
    sources:
      # This manifest lives in packaging/flatpak/, so the repository root is two
      # levels up. With `..` flatpak-builder copies the packaging directory
      # instead of the source tree, and the build fails with no CMakeLists.txt.
      - type: dir
        path: ../..
    cleanup:
      - /include
      - /lib/*.a
      - /lib/pkgconfig
      - /share/doc
      - /share/man
      - '*.a'
      - '*.la'