name: build

# The packages are the product here, so they are what gets built. A green run
# means each packaging format really was produced, not that one binary compiled.
#
# Paint.QT targets Linux and the BSDs. macOS is covered because the same CMake
# produces a working bundle there for free; Windows is not a target.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (TGZ, DEB, RPM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev libqt6svg6-dev qt6-base-dev-tools \
            rpm fakeroot

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      # Headless: the suites use the offscreen platform, which is the whole
      # reason they can run on a machine with no display.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # cpack writes beside the project, not into the build directory, because
      # CPACK_INSTALL_CMAKE_PROJECTS is set in CMakeLists so the package can be
      # inspected afterwards. Every later step has to look in both places.
      - name: Package
        run: |
          cpack --config build/CPackSourceConfig.cmake
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM || true
          ls -la ./*.deb ./*.rpm ./*.tar.gz

      - name: Check the .deb
        run: |
          sudo apt-get install -y dpkg-dev
          deb=$(ls ./*.deb build/*.deb 2>/dev/null | head -1)
          if [ -z "${deb}" ]; then echo "no .deb was produced"; exit 1; fi
          echo "Inspecting ${deb}"
          dpkg-deb --info "${deb}"
          # An empty Architecture field is a .deb no installer will accept, and
          # that is exactly what CPack produces when dpkg is missing.
          dpkg-deb --field "${deb}" Architecture | grep -qE '^(amd64|arm64)$'
          dpkg-deb --field "${deb}" Depends | grep -q qt6
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/applications/paint-qt.desktop'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/icons/hicolor/256x256/apps/paint-qt.png'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml'

      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./*.deb
          command -v paint-qt
          # Prove it starts and paints: render a stroke offscreen and check the
          # pixels changed.
          QT_QPA_PLATFORM=offscreen paint-qt --version

      - name: Validate the desktop entry
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/linux/paint-qt.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.tar.gz

  macos:
    name: macOS (bundle, DragNDrop)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Qt comes from Homebrew rather than from aqtinstall. aqtinstall is a
      # Python tool and the runner's Python keeps moving, where the current one
      # makes it fail with "not found while parsing XML of package information"
      # before the build even starts. Homebrew's Qt is a normal dependency the
      # runner can actually satisfy.
      - name: Install Qt
        id: qt
        run: |
          brew install qt
          echo "prefix=$(brew --prefix qt)" >> "$GITHUB_OUTPUT"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.prefix }}
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -G TGZ

      - name: Check the bundle icon
        run: |
          bundle=$(find build -name 'paint-qt.app' -maxdepth 3 | head -1)
          test -n "${bundle}" || { echo "no bundle produced"; exit 1; }
          test -f "${bundle}/Contents/Resources/paint-qt.icns" \
            || { echo "the bundle has no icon"; exit 1; }
          echo "bundle icon present"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            *.dmg
            *.tar.gz

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev zsync desktop-file-utils \
            file

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      # linuxdeploy bundles the Qt libraries the binary links against, so the
      # result runs on a machine that has no Qt installed. The Qt plugin that
      # ships with it is what keeps the icon and the platform theme working.
      - name: Package as an AppImage
        run: |
          set -euo pipefail
          # No `cd` here: every path below is either absolute or relative to the
          # workspace root. An earlier version did `cd build`, which turned the
          # install step's `build` into `build/build` and it found nothing.
          cmake --install build --prefix /tmp/appimage-root
          sudo apt-get install -y wget desktop-file-utils

          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

          # The application has to be found under a standard prefix.
          export APPDIR=/tmp/appdir
          ./linuxdeploy.AppImage --appdir="${APPDIR}" \
            --executable="$GITHUB_WORKSPACE/build/bin/paint-qt" \
            --desktop-file="$GITHUB_WORKSPACE/packaging/linux/paint-qt.desktop" \
            --icon-file="$GITHUB_WORKSPACE/packaging/icons/paint-qt.svg"

          # Qt's own plugin must be deployed or the image will not find its
          # platform plugin at run time.
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt.AppImage
          ./linuxdeploy-plugin-qt.AppImage --appdir="${APPDIR}"

          # Ask the image to run its own AppRun, so the bundled Qt is found.
          sed -i 's|^Exec=|Exec=AppRun |' "${APPDIR}"/usr/share/applications/*.desktop || true

          mkdir -p "${APPDIR}/usr/share/metainfo"
          cp "$GITHUB_WORKSPACE/packaging/linux/io.github.paintqt.Paint.QT.metainfo.xml" \
            "${APPDIR}/usr/share/metainfo/"

          # appimagetool, not mksquashfs plus hand written magic bytes. A bare
          # squashfs with AI\x02 at offset 8 has the right header and is still not
          # an AppImage: the runtime refuses it with "Not an AppImage", because a
          # type 2 image is the AppImageKit runtime ELF with the filesystem
          # appended, and only appimagetool knows how to lay that out.
          #
          # It also insists on the desktop file and the icon sitting at the top of
          # the AppDir, not only under usr/share, and aborts with "Desktop file not
          # found" otherwise.
          wget -q -O appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          cp "$GITHUB_WORKSPACE/packaging/linux/paint-qt.desktop" "${APPDIR}/paint-qt.desktop"
          cp "$GITHUB_WORKSPACE/packaging/icons/paint-qt-256.png" "${APPDIR}/paint-qt.png"

          OUTPUT="$GITHUB_WORKSPACE/build/paint-qt.AppImage"
          ARCH=x86_64 ./appimagetool "${APPDIR}" "${OUTPUT}"

          ls -la "${OUTPUT}"
          test -s "${OUTPUT}"
          # The header has to be the runtime ELF with the AppImage magic at
          # offset 8, and the image has to actually answer --version.
          head -c 12 "${OUTPUT}" | xxd | head -1
          # A runner has no FUSE, so mounting the image is impossible there. The
          # runtime's extraction path runs it from a temporary directory instead,
          # which is what this variable selects.
          APPIMAGE_EXTRACT_AND_RUN=1 "${OUTPUT}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/paint-qt.AppImage

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Flathub's own builder SDK is used rather than the distribution's
      # flatpak-builder. The Ubuntu packages ship appstreamcli 1.0.2, whose
      # compose step fails with file-read-error on the component even though the
      # same metadata validates and composes with a current appstreamcli. The SDK
      # pairs a flatpak-builder with the matching appstreamcli, which is why
      # Flathub recommends it for building submissions.
      # Flathub retires runtime versions, and a manifest naming a retired one
      # fails deep inside the build with "Unable to find sdk org.kde.Sdk version
      # 6.7", which says nothing about what to do next. This asks Flathub what it
      # actually publishes and names the alternatives, before anything is built.
      - name: Check that the runtime still exists
        run: |
          set -euo pipefail
          # flatpak itself is installed here rather than left to the next step:
          # this one asks the remote a question and the runner has no flatpak
          # until something installs it.
          sudo apt-get update
          sudo apt-get install -y flatpak
          manifest=packaging/flatpak/io.github.paintqt.Paint.QT.yaml
          runtime=$(sed -n "s/^runtime: *//p" "${manifest}" | head -1 | tr -d "'")
          version=$(sed -n "s/^runtime-version: *//p" "${manifest}" | head -1 | tr -d "'")
          # The remote has to exist before it can be asked, and this step runs
          # before the install one. --if-not-exists makes the repeat harmless.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          published=$(flatpak remote-ls --user flathub --arch=x86_64 \
            --columns=application,branch 2>/dev/null || true)
          # The match has to be on the pair. Searching the branch column on its own
          # finds a 6.7 belonging to some other application, so a retired
          # org.kde.Platform 6.7 looks available and the build fails later anyway.
          if ! awk -F'\t' -v r="${runtime}" -v v="${version}" \
                '$1 == r && $2 == v { found = 1 } END { exit !found }' <<< "${published}"; then
            echo "error: Flathub no longer publishes ${runtime} version ${version}." >&2
            echo "versions it does publish for ${runtime}:" >&2
            awk -F'\t' -v r="${runtime}" '$1 == r { print "  " $2 }' <<< "${published}" \
              | sort -V | tail -8 >&2
            exit 1
          fi
          echo "${runtime} ${version} is available"

      - name: Install the builder SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak desktop-file-utils appstream
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          # org.flatpak.Builder is published on the stable branch; asking for a
          # numbered branch made flatpak report "Nothing matches
          # org.flatpak.Builder in remote flathub" even though it is there.
          flatpak install --user -y flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11 org.flatpak.Builder//stable

      # Run the AppStream validator before the build: compose runs it too, but
      # only after the whole application has compiled, so a metadata mistake
      # would cost a full build cycle to discover.
      - name: Validate the metadata
        run: |
          appstreamcli validate --no-net --explain \
            packaging/linux/io.github.paintqt.Paint.QT.metainfo.xml
          desktop-file-validate packaging/linux/paint-qt.desktop

      - name: Build and verify
        run: |
          set -euo pipefail
          flatpak run --command=flatpak-builder org.flatpak.Builder \
            --disable-rofiles-fuse \
            --user --repo="$PWD/flatpak-repo" --force-clean \
            stable packaging/flatpak/io.github.paintqt.Paint.QT.yaml

          # --verify starts the application in the sandbox and waits for it to
          # exit. The editor itself would never exit on a runner with no display,
          # so it is verified through --version, which does.
          flatpak run --command=flatpak-builder org.flatpak.Builder \
            --verify --print-repo \
            --command="paint-qt --version" \
            --env=QT_QPA_PLATFORM=offscreen \
            "$PWD/flatpak-repo" stable

      # Publish the result as a standalone ostree repository: this is what a user
      # installs from, and it needs no Flathub account and no review. A dedicated
      # GPG key signs the export, because flatpak refuses to install from a
      # repository whose commits it cannot verify.
      - name: Export a signed ostree repository
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_FPR: ${{ vars.FLATPAK_GPG_FPR }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p mode 700 "$GNUPGHOME"

          # The signing key is one long lived key held in the repository secrets,
          # not a fresh one per run. A key that changes on every release is worse
          # than no key: a user who trusted yesterday's key cannot verify today's
          # build, and the fingerprint printed in the README stops being true.
          #
          # When the secret is absent, which is the case for a fork, a throwaway
          # key is generated so the job still produces a buildable repository.
          if [ -n "${FLATPAK_GPG_KEY:-}" ]; then
            printf '%s' "${FLATPAK_GPG_KEY}" | gpg --batch --import
            keyid="${FLATPAK_GPG_FPR}"
            echo "signing with the repository key ${keyid}"
          else
            echo "no FLATPAK_GPG_KEY secret, generating a throwaway key"
            gpg --batch --quick-generate-key \
              "Paint.QT Flatpak signing key <flatpak@paint-qt.invalid>" ed25519 sign never
            keyid=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          fi
          # Trust the imported key so ostree will sign with it.
          gpg --batch --import-ownertrust <<< "${keyid}:6:"
          gpg --batch --check-trustdb 2>/dev/null || true

          flatpak build-export --user --gpg-hash="${keyid}" \
            flatpak-repo flatpak-build io.github.paintqt.Paint.QT stable
          gpg --armor --export "${keyid}" > flatpak-repo/paint-qt.gpg

          test -f flatpak-repo/exports/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml
          test -f flatpak-repo/exports/share/applications/paint-qt.desktop
          test -f flatpak-repo/exports/share/icons/hicolor/scalable/apps/paint-qt.svg
          test -f flatpak-repo/exports/share/bin/paint-qt

          # The one-line installer a software centre understands.
          commit=$(ostree --repo=flatpak-repo refs/heads/stable)
          cat > flatpak-repo/io.github.paintqt.Paint.QT.flatpakref <<EOF
          [Flatpak Repo]
          Title=Paint.QT
          Url=https://rubcut.github.io/Paint.QT-repo/repo
          Branch=stable
          Commit=${commit}
          Timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          [Runtime]
          Runtime=runtime/org.kde.Platform/x86_64/6.11
          Sdk=org.kde.Sdk/x86_64/6.11
          Commit=${commit}
          [Application]
          Name=io.github.paintqt.Paint.QT
          Branch=stable
          EOF
          cat flatpak-repo/io.github.paintqt.Paint.QT.flatpakref

      - name: Single-file bundle
        run: |
          flatpak build-bundle --user flatpak-repo paint-qt.flatpak stable
          ls -la paint-qt.flatpak

      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf pages-repo
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${{ github.repository_owner }}/Paint.QT-repo.git" pages-repo \
            || git init -q pages-repo
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages 2>/dev/null || true
          git rm -rq --cached . 2>/dev/null || true
          rm -rf repo
          cp -r "$GITHUB_WORKSPACE/flatpak-repo" repo
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Paint.QT Flatpak repository</title></head>
          <body><h1>Paint.QT</h1>
          <p>Install from GNOME Software, KDE Discover or a terminal:</p>
          <pre>flatpak install --user --noninteractive \
            https://rubcut.github.io/Paint.QT-repo/repo io.github.paintqt.Paint.QT</pre>
          <p>Or paste the .flatpakref into a software centre.</p></body></html>
          EOF
          git add -A
          git commit -m "Update the Flatpak repository" || echo "nothing to commit"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/Paint.QT-repo.git" HEAD:gh-pages

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            paint-qt.flatpak
            flatpak-repo/io.github.paintqt.Paint.QT.flatpakref
            flatpak-repo/paint-qt.gpg

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      # base-devel brings the compiler and the headers: the archlinux:latest
      # container is deliberately minimal, so without it CMake finds no C++
      # compiler at all. makepkg also needs fakeroot to run and core/debugedit to
      # produce the package, and makepkg refuses to run as root, which a
      # container job is.
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja qt6-base qt6-svg fakeroot core/debugedit

      # The PKGBUILD fetches the release tarball, which does not exist before a
      # tag is pushed. Rather than rewriting the recipe with sed, which would
      # test a PKGBUILD nobody ships, lay the sources out the way makepkg expects
      # an unpacked tarball and empty only the source list, so the recipe is
      # exercised verbatim.
      - name: Lay out the sources like an unpacked tarball
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          # Stage outside src/ first: copying src/ into src/paint-qt-$version/
          # is a copy of a directory into itself, which cp refuses.
          staging=$(mktemp -d)
          cp -r src tools tests packaging CMakeLists.txt LICENSE README.md "$staging/"
          mkdir -p src
          mv "$staging" "src/paint-qt-${version}"
          cp packaging/aur/PKGBUILD .
          sed -i 's|^source=.*|source=()|; s|^sha256sums=.*|sha256sums=()|' PKGBUILD
          grep -E '^(pkgver|source|sha256sums)=' PKGBUILD

      - name: Build the package
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$PWD"
          su builder -c 'cd "'"$PWD"'" && makepkg -s --noconfirm --nodeps'
          chown -R "$(id -u):$(id -g)" "$PWD" || true

      - name: Inspect the package
        run: |
          pkg=$(ls ./*.pkg.tar.zst 2>/dev/null | grep -v debug | head -1)
          if [ -z "${pkg}" ]; then echo "no package was produced"; exit 1; fi
          echo "Built ${pkg}"
          bsdtar -tf "${pkg}" | grep -q 'usr/bin/paint-qt'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/applications/paint-qt.desktop'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/icons/hicolor/scalable/apps/paint-qt.svg'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/licenses/paint-qt/LICENSE'
