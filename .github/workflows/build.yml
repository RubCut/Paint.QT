name: build

# The packages are the product here, so they are what gets built. A green run
# means each packaging format really was produced, not that one binary compiled.
#
# Paint.QT targets Linux and the BSDs. macOS is covered because the same CMake
# produces a working bundle there for free; Windows is not a target.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (TGZ, DEB, RPM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev libqt6svg6-dev qt6-base-dev-tools \
            rpm fakeroot

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      # Headless: the suites use the offscreen platform, which is the whole
      # reason they can run on a machine with no display.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # cpack writes beside the project, not into the build directory, because
      # CPACK_INSTALL_CMAKE_PROJECTS is set in CMakeLists so the package can be
      # inspected afterwards. Every later step has to look in both places.
      - name: Package
        run: |
          cpack --config build/CPackSourceConfig.cmake
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM || true
          ls -la ./*.deb ./*.rpm ./*.tar.gz

      - name: Check the .deb
        run: |
          sudo apt-get install -y dpkg-dev
          deb=$(ls ./*.deb build/*.deb 2>/dev/null | head -1)
          if [ -z "${deb}" ]; then echo "no .deb was produced"; exit 1; fi
          echo "Inspecting ${deb}"
          dpkg-deb --info "${deb}"
          # An empty Architecture field is a .deb no installer will accept, and
          # that is exactly what CPack produces when dpkg is missing.
          dpkg-deb --field "${deb}" Architecture | grep -qE '^(amd64|arm64)$'
          dpkg-deb --field "${deb}" Depends | grep -q qt6
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/applications/paint-qt.desktop'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/icons/hicolor/256x256/apps/paint-qt.png'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml'

      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./*.deb
          command -v paint-qt
          # Prove it starts and paints: render a stroke offscreen and check the
          # pixels changed.
          QT_QPA_PLATFORM=offscreen paint-qt --version

      - name: Validate the desktop entry
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/linux/paint-qt.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.tar.gz

  macos:
    name: macOS (bundle, DragNDrop)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          modules: 'qtbase qtsvg'
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ steps.install-qt.outputs.qt_dir }}
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -G TGZ

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            build/*.dmg
            build/*.tar.gz

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.kde.Platform//6.7 org.kde.Sdk//6.7

      # --verify is what makes this job worth having: it proves the app starts
      # inside the sandbox, which is exactly what a Flathub review checks.
      - name: Build and verify
        run: packaging/flatpak/build-flatpak.sh --verify

      - name: Check the metadata
        run: |
          flatpak build-export packaging/flatpak/flatpak-repo \
            build/flatpak-build io.github.paintqt.Paint.QT stable
          test -f packaging/flatpak/flatpak-repo/exports/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml
          test -f packaging/flatpak/flatpak-repo/exports/share/applications/paint-qt.desktop
          test -f packaging/flatpak/flatpak-repo/exports/share/icons/hicolor/scalable/apps/paint-qt.svg

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed cmake ninja qt6-base qt6-svg

      # The PKGBUILD fetches the release tarball, which does not exist before a
      # tag is pushed. Rather than rewriting the recipe with sed, which would
      # test a PKGBUILD nobody ships, lay the sources out the way makepkg expects
      # an unpacked tarball and empty the source list. The recipe itself is then
      # exercised verbatim.
      - name: Lay out the sources like an unpacked tarball
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          mkdir -p "src/paint-qt-${version}"
          cp -r src tools tests packaging CMakeLists.txt LICENSE README.md "src/paint-qt-${version}/"
          cp packaging/aur/PKGBUILD .
          sed -i 's|^source=.*|source=()|; s|^sha256sums=.*|sha256sums=()|' PKGBUILD
          grep -E '^(pkgver|source|sha256sums)=' PKGBUILD

      - name: Build the package
        run: makepkg -s --noconfirm --nodeps

      - name: Inspect the package
        run: |
          pkg=$(ls ./*.pkg.tar.zst 2>/dev/null | grep -v debug | head -1)
          if [ -z "${pkg}" ]; then echo "no package was produced"; exit 1; fi
          echo "Built ${pkg}"
          bsdtar -tf "${pkg}" | grep -q 'usr/bin/paint-qt'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/applications/paint-qt.desktop'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/icons/hicolor/scalable/apps/paint-qt.svg'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/metainfo/io.github.paintqt.Paint.QT.metainfo.xml'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/licenses/paint-qt/LICENSE'