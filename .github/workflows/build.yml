name: build

# The packages are the product here, so they are what gets built. A green run
# means each packaging format really was produced, not that one binary compiled.
#
# Paint.QT targets Linux and the BSDs. macOS is covered because the same CMake
# produces a working bundle there for free; Windows is not a target.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (TGZ, DEB, RPM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev libqt6svg6-dev qt6-base-dev-tools \
            rpm fakeroot

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      # Headless: the suites use the offscreen platform, which is the whole
      # reason they can run on a machine with no display.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The same suite again against a real X server. The offscreen platform is a
      # separate Qt code path from x11, and the AppImage job failed on exactly
      # that difference: the Qt that linuxdeploy bundles carries only the X11
      # plugin, so a green offscreen run said nothing about whether the shipped
      # application can start. All six suites pass here too, in about nine
      # seconds, and now both paths are covered on every push.
      - name: Test against a real X server
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a ctest --test-dir build --output-on-failure

      # cpack writes beside the project, not into the build directory, because
      # CPACK_INSTALL_CMAKE_PROJECTS is set in CMakeLists so the package can be
      # inspected afterwards. Every later step has to look in both places.
      - name: Package
        run: |
          cpack --config build/CPackSourceConfig.cmake
          cpack --config build/CPackConfig.cmake -G TGZ
          cpack --config build/CPackConfig.cmake -G DEB
          cpack --config build/CPackConfig.cmake -G RPM || true
          ls -la ./*.deb ./*.rpm ./*.tar.gz

      - name: Check the .deb
        run: |
          sudo apt-get install -y dpkg-dev
          deb=$(ls ./*.deb build/*.deb 2>/dev/null | head -1)
          if [ -z "${deb}" ]; then echo "no .deb was produced"; exit 1; fi
          echo "Inspecting ${deb}"
          dpkg-deb --info "${deb}"
          # An empty Architecture field is a .deb no installer will accept, and
          # that is exactly what CPack produces when dpkg is missing.
          dpkg-deb --field "${deb}" Architecture | grep -qE '^(amd64|arm64)$'
          dpkg-deb --field "${deb}" Depends | grep -q qt6
          # By the application id, not the binary name: that is what the install
          # rules rename to, so that Flatpak exports the files and Flathub accepts
          # the submission.
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/applications/io.github.RubCut.Paint.QT.desktop'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/icons/hicolor/256x256/apps/io.github.RubCut.Paint.QT.png'
          dpkg-deb --contents "${deb}" | grep -q 'usr/share/metainfo/io.github.RubCut.Paint.QT.metainfo.xml'

      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./*.deb
          command -v paint-qt
          # Prove it starts and paints: render a stroke offscreen and check the
          # pixels changed.
          QT_QPA_PLATFORM=offscreen paint-qt --version

      - name: Validate the desktop entry
        run: |
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/linux/paint-qt.desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm
            *.tar.gz

  macos:
    name: macOS (bundle, DragNDrop)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      # Qt comes from Homebrew rather than from aqtinstall. aqtinstall is a
      # Python tool and the runner's Python keeps moving, where the current one
      # makes it fail with "not found while parsing XML of package information"
      # before the build even starts. Homebrew's Qt is a normal dependency the
      # runner can actually satisfy.
      - name: Install Qt
        id: qt
        run: |
          brew install qt
          echo "prefix=$(brew --prefix qt)" >> "$GITHUB_OUTPUT"
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.prefix }}
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Package
        run: cpack --config build/CPackConfig.cmake -G DragNDrop -G TGZ

      - name: Check the bundle icon
        run: |
          bundle=$(find build -name 'paint-qt.app' -maxdepth 3 | head -1)
          test -n "${bundle}" || { echo "no bundle produced"; exit 1; }
          test -f "${bundle}/Contents/Resources/paint-qt.icns" \
            || { echo "the bundle has no icon"; exit 1; }
          echo "bundle icon present"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            *.dmg
            *.tar.gz

  appimage:
    name: AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            qt6-base-dev libqt6svg6-dev libgl1-mesa-dev zsync desktop-file-utils \
            file

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQT_VERSION=6

      - name: Build
        run: cmake --build build

      # linuxdeploy bundles the Qt libraries the binary links against, so the
      # result runs on a machine that has no Qt installed. The Qt plugin that
      # ships with it is what keeps the icon and the platform theme working.
      - name: Package as an AppImage
        run: |
          set -euo pipefail
          # No `cd` here: every path below is either absolute or relative to the
          # workspace root. An earlier version did `cd build`, which turned the
          # install step's `build` into `build/build` and it found nothing.
          cmake --install build --prefix /tmp/appimage-root
          sudo apt-get install -y wget desktop-file-utils libfuse2t64

          wget -q -O linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

          # The application has to be found under a standard prefix.
          export APPDIR=/tmp/appdir
          # linuxdeploy resolves the desktop entry's Icon= against the icon paths
          # it knows about, and stopped with "Could not find suitable icon for Icon
          # entry: io.github.RubCut.Paint.QT" when the name was changed to the
          # application id. Putting the icon in the standard hicolor path first,
          # under that name, is what it looks for.
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          cp "$GITHUB_WORKSPACE/packaging/icons/paint-qt-256.png" \
            "${APPDIR}/usr/share/icons/hicolor/256x256/apps/io.github.RubCut.Paint.QT.png"
          ./linuxdeploy.AppImage --appdir="${APPDIR}" \
            --executable="$GITHUB_WORKSPACE/build/bin/paint-qt" \
            --desktop-file="$GITHUB_WORKSPACE/packaging/linux/paint-qt.desktop" \
            --icon-file="$GITHUB_WORKSPACE/packaging/icons/paint-qt.svg"

          # Qt's own plugin must be deployed or the image will not find its
          # platform plugin at run time.
          wget -q -O linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt.AppImage
          ./linuxdeploy-plugin-qt.AppImage --appdir="${APPDIR}"

          # Ask the image to run its own AppRun, so the bundled Qt is found.
          sed -i 's|^Exec=|Exec=AppRun |' "${APPDIR}"/usr/share/applications/*.desktop || true

          mkdir -p "${APPDIR}/usr/share/metainfo"
          cp "$GITHUB_WORKSPACE/packaging/linux/io.github.RubCut.Paint.QT.metainfo.xml" \
            "${APPDIR}/usr/share/metainfo/"

          # appimagetool, not mksquashfs plus hand written magic bytes. A bare
          # squashfs with AI\x02 at offset 8 has the right header and is still not
          # an AppImage: the runtime refuses it with "Not an AppImage", because a
          # type 2 image is the AppImageKit runtime ELF with the filesystem
          # appended, and only appimagetool knows how to lay that out.
          #
          # It also insists on the desktop file and the icon sitting at the top of
          # the AppDir, not only under usr/share, and aborts with "Desktop file not
          # found" otherwise.
          #
          # linuxdeploy leaves a paint-qt.desktop symlink at the root as well, so
          # remove it: the id named one is the one the metainfo's launchable
          # points at, and two desktop files at the top of the tree is one too
          # many. The copy inside usr/share is renamed to match for the same
          # reason.
          wget -q -O appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # Named after the application id, which is what the desktop entry's
          # Icon= asks for and what the metainfo's launchable names. Copying them
          # in under the binary name left the image describing files it does not
          # contain.
          cp "$GITHUB_WORKSPACE/packaging/linux/paint-qt.desktop" \
            "${APPDIR}/io.github.RubCut.Paint.QT.desktop"
          cp "$GITHUB_WORKSPACE/packaging/icons/paint-qt-256.png" \
            "${APPDIR}/io.github.RubCut.Paint.QT.png"
          cp "$GITHUB_WORKSPACE/packaging/icons/paint-qt.svg" \
            "${APPDIR}/io.github.RubCut.Paint.QT.svg"

          OUTPUT="$GITHUB_WORKSPACE/build/paint-qt.AppImage"
          rm -f "${APPDIR}/paint-qt.desktop" "${APPDIR}/paint-qt.png"
          if [ -f "${APPDIR}/usr/share/applications/paint-qt.desktop" ]; then
            mv "${APPDIR}/usr/share/applications/paint-qt.desktop" \
              "${APPDIR}/usr/share/applications/io.github.RubCut.Paint.QT.desktop"
          fi
          test -f "${APPDIR}/usr/share/applications/io.github.RubCut.Paint.QT.desktop"

          ARCH=x86_64 ./appimagetool "${APPDIR}" "${OUTPUT}"

          ls -la "${OUTPUT}"
          test -s "${OUTPUT}"
          # The header has to be the runtime ELF with the AppImage magic at
          # offset 8, and the image has to actually answer --version.
          head -c 12 "${OUTPUT}" | xxd | head -1
          # The runtime calls dlopen on libfuse.so.2 before it looks at any
          # argument, so on a runner without libfuse even --appimage-extract dies
          # with "dlopen(): error loading libfuse.so.2" and no squashfs-root is
          # produced. libfuse2t64 is installed above for that reason; the image is
          # still unpacked rather than mounted, because a runner cannot mount.
          # Under a virtual display, not with QT_QPA_PLATFORM=offscreen: the Qt
          # that linuxdeploy bundles carries only the xcb platform plugin, so an
          # offscreen run aborts with "Available platform plugins are: xcb".
          # Running against a real X server is also the path a user takes.
          rm -rf squashfs-root
          "${OUTPUT}" --appimage-extract
          test -x squashfs-root/AppRun
          sudo apt-get install -y xvfb
          xvfb-run -a ./squashfs-root/AppRun --version

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: build/paint-qt.AppImage

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    # The Pages publication pushes to this repository's gh-pages branch, and the
    # default token only has contents: read. Without this the push is refused
    # with "Permission to RubCut/Paint.QT.git denied to github-actions[bot]",
    # which is what happened when the token also had to reach a second
    # repository and the reason was misread as a scoping problem rather than a
    # missing permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Flathub retires runtime versions, and a manifest naming a retired one
      # fails deep inside the build with "Unable to find sdk org.kde.Sdk version
      # 6.7", which says nothing about what to do next. This asks Flathub what it
      # actually publishes and names the alternatives, before anything is built.
      - name: Check that the runtime still exists
        run: |
          set -euo pipefail
          # flatpak itself is installed here rather than left to the next step:
          # this one asks the remote a question and the runner has no flatpak
          # until something installs it.
          sudo apt-get update
          sudo apt-get install -y flatpak
          manifest=packaging/flatpak/io.github.RubCut.Paint.QT.yaml
          runtime=$(sed -n "s/^runtime: *//p" "${manifest}" | head -1 | tr -d "'")
          version=$(sed -n "s/^runtime-version: *//p" "${manifest}" | head -1 | tr -d "'")
          # The remote has to exist before it can be asked, and this step runs
          # before the install one. --if-not-exists makes the repeat harmless.
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          published=$(flatpak remote-ls --user flathub --arch=x86_64 \
            --columns=application,branch 2>/dev/null || true)
          # The match has to be on the pair. Searching the branch column on its own
          # finds a 6.7 belonging to some other application, so a retired
          # org.kde.Platform 6.7 looks available and the build fails later anyway.
          if ! awk -F'\t' -v r="${runtime}" -v v="${version}" \
                '$1 == r && $2 == v { found = 1 } END { exit !found }' <<< "${published}"; then
            echo "error: Flathub no longer publishes ${runtime} version ${version}." >&2
            echo "versions it does publish for ${runtime}:" >&2
            awk -F'\t' -v r="${runtime}" '$1 == r { print "  " $2 }' <<< "${published}" \
              | sort -V | tail -8 >&2
            exit 1
          fi
          echo "${runtime} ${version} is available"

      - name: Install the runtimes and the builder
        run: |
          sudo apt-get update
          # flatpak-builder itself: installing the runtimes is not enough, and
          # without this the build step dies on "flatpak-builder: command not
          # found".
          # librsvg2-common carries the gdk-pixbuf SVG loader, without which
          # flatpak cannot read the scalable icon and the export stops on
          # "... io.github.RubCut.Paint.QT.svg is not a valid icon: Format not
          # recognized". Reproduced here: GdkPixbuf refuses the same file with
          # "Couldn't recognize the image file format" on a machine without the
          # loader, and the loader is not part of a base install.
          sudo apt-get install -y flatpak flatpak-builder desktop-file-utils \
            appstream librsvg2-common
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.kde.Platform//6.11 org.kde.Sdk//6.11

      # Run the AppStream validator before the build: compose runs it too, but
      # only after the whole application has compiled, so a metadata mistake
      # would cost a full build cycle to discover.
      - name: Validate the metadata
        run: |
          appstreamcli validate --no-net --explain \
            packaging/linux/io.github.RubCut.Paint.QT.metainfo.xml
          desktop-file-validate packaging/linux/paint-qt.desktop

      # The distribution's flatpak-builder, not org.flatpak.Builder. The builder
      # SDK runs flatpak-builder inside a sandbox that does not see the SDK
      # installed for the user, so the build failed with "Unable to find sdk
      # org.kde.Sdk version 6.11" immediately, while the same manifest compiled
      # fine with the distribution's builder.
      - name: Build
        run: |
          set -euo pipefail
          # The form is flatpak-builder [OPTIONS] BUILD_DIR MANIFEST, so the
          # directory has to be named. It was passing "stable" as the build
          # directory and the manifest as a second positional, and the export
          # step then failed on "Build directory flatpak-build not initialized".
          #
          # No --repo here: the export step below writes the repository, signed,
          # and exporting twice would leave an unsigned commit in its history.
          flatpak-builder \
            --user --force-clean \
            flatpak-build packaging/flatpak/io.github.RubCut.Paint.QT.yaml

          # flatpak-builder refuses to export any icon gdk-pixbuf cannot read,
          # which it did for the SVG and then for the .ico, each time only after
          # the whole build. The manifest drops both, and this says so plainly if
          # a third format ever reaches the tree.
          stray=$(find flatpak-build/files/share/icons -type f ! -name '*.png' || true)
          if [ -n "${stray}" ]; then
            echo "error: these icons are not PNG and flatpak will refuse the export:" >&2
            echo "${stray}" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "all icons are PNG"

      # Publish the result as a standalone ostree repository: this is what a user
      # installs from, and it needs no Flathub account and no review. A dedicated
      # GPG key signs the export, because flatpak refuses to install from a
      # repository whose commits it cannot verify.
      - name: Export a signed ostree repository
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
          FLATPAK_GPG_FPR: ${{ vars.FLATPAK_GPG_FPR }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          # The flag is -m 700, not the words. Written as "mode 700" it created
          # two directories called mode and 700 and left the keyring world
          # readable, which gpg refuses to work with.
          mkdir -p -m 700 "$GNUPGHOME"

          # The signing key is one long lived key held in the repository secrets,
          # not a fresh one per run. A key that changes on every release is worse
          # than no key: a user who trusted yesterday's key cannot verify today's
          # build, and the fingerprint printed in the README stops being true.
          #
          # When the secret is absent, which is the case for a fork, a throwaway
          # key is generated so the job still produces a buildable repository.
          if [ -n "${FLATPAK_GPG_KEY:-}" ]; then
            printf '%s' "${FLATPAK_GPG_KEY}" | gpg --batch --import
            keyid="${FLATPAK_GPG_FPR}"
            echo "signing with the repository key ${keyid}"
          else
            echo "no FLATPAK_GPG_KEY secret, generating a throwaway key"
            # The parameter file, not --quick-generate-key: the quick form asks
            # the agent for a passphrase through a prompt that has no terminal
            # here, and it fails with "agent_genkey failed: Timeout".
            cat > "$RUNNER_TEMP/keyparams" <<'PARAMS'
          %no-protection
          Key-Type: eddsa
          Key-Curve: ed25519
          Key-Usage: sign
          Name-Real: Paint.QT Flatpak signing key
          Name-Email: flatpak@paint-qt.invalid
          Expire-Date: 0
          %commit
          PARAMS
            gpg --batch --gen-key "$RUNNER_TEMP/keyparams"
            keyid=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          fi
          # Trust the imported key so ostree will sign with it.
          gpg --batch --import-ownertrust <<< "${keyid}:6:"
          gpg --batch --check-trustdb 2>/dev/null || true

          # The signing option was renamed: 1.14 spells it --gpg-hash and 1.18
          # spells it --gpg-sign, and passing the wrong one stops the export with
          # "Unknown option". Ask the tool which it has rather than guessing.
          sign_flag=--gpg-hash
          if flatpak build-export --help 2>&1 | grep -q -- '--gpg-sign='; then
            sign_flag=--gpg-sign
          fi
          echo "signing with ${sign_flag}"

          # No --user: build-export takes the repository as its LOCATION argument
          # and the distribution's flatpak has no such option, so the export died
          # with "Unknown option --user" before writing anything.
          # LOCATION DIRECTORY [BRANCH], three arguments. The application id was
          # being passed as a fourth and the export stopped with "Too many
          # arguments": a build directory already carries the metadata
          # flatpak-builder wrote into it.
          flatpak build-export "${sign_flag}=${keyid}" \
            flatpak-repo flatpak-build stable
          gpg --armor --export "${keyid}" > flatpak-repo/paint-qt.gpg

          # Both names are read back out of the repository rather than assumed.
          #
          # The ref is not refs/heads/<branch>: it is
          # refs/heads/app/<id>/<arch>/<branch>, where "app" is the namespace
          # flatpak uses for applications, and the branch is the leaf. An earlier
          # version looked for a file one level down, found none, and reported
          # that the export had written no branch when it had written exactly the
          # right one.
          ref=$(find flatpak-repo/refs/heads -type f -printf '%P\n' | head -1)
          branch=$(find flatpak-repo/refs/heads -type f -printf '%f\n' | head -1)
          if [ -z "${ref}" ] || [ -z "${branch}" ]; then
            echo "error: the export wrote no ref under refs/heads" >&2
            find flatpak-repo/refs >&2
            exit 1
          fi
          echo "exported as ${ref}, branch ${branch}"

          # The files are checked in the build directory, not in the repository: a
          # summary repository keeps everything in objects/ and has no exports/
          # directory at all, which is what the first version of this check
          # assumed and why it named four missing files.
          #
          # Two trees, because flatpak-builder has two: files/ is the
          # application's own /app content, where the binary is, and export/ holds
          # the extra files it adds to the commit, where the desktop entry, the
          # icons and the metadata are.
          #
          # Each one is named when missing, and the tree printed, because a bare
          # `test -f` fails the step in silence.
          missing=0
          for want in \
            "flatpak-build/export/share/metainfo/io.github.RubCut.Paint.QT.metainfo.xml" \
            "flatpak-build/export/share/applications/io.github.RubCut.Paint.QT.desktop" \
            "flatpak-build/export/share/icons/hicolor/256x256/apps/io.github.RubCut.Paint.QT.png" \
            "flatpak-build/files/bin/paint-qt" \
            "flatpak-repo/config" \
            "flatpak-repo/summary.sig" \
            "flatpak-repo/paint-qt.gpg" \
            "flatpak-repo/refs/heads/${ref}" \
          ; do
            if [ ! -e "${want}" ]; then
              echo "error: missing ${want}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "the build directory exports:" >&2
            find flatpak-build/export -maxdepth 3 -mindepth 1 >&2
            echo "the repository holds:" >&2
            find flatpak-repo -maxdepth 1 -mindepth 1 >&2
            exit 1
          fi

          # The one-line installer a software centre understands.
          #
          # The shape of this file was measured rather than guessed. A flatpakref
          # uses the group [Flatpak Ref], and RuntimeRepo, GPGKey, Url and Name are
          # top level keys rather than entries under a section: written as
          # "[Flatpak Repo]" it is refused with "no Flatpak Ref group".
          #
          # RuntimeRepo has to be there. Without it flatpak says "Flatpakref file
          # does not contain a RuntimeRepo" and cannot find the runtime. GPGKey is
          # the public key base64 encoded and inline, which is how flatpak reads it,
          # and carrying it here is what saves the person installing this a separate
          # `gpg --import` step.
          #
          # No Commit= lines: a real flatpakref carries the xa.ref value of each
          # commit rather than the ostree commit hash, and a hash there produces a
          # file that looks filled in and installs nothing.
          #
          # Checked end to end against a local http server: flatpak parsed this
          # shape, accepted the key, added the remote, and got as far as looking for
          # the application ref.
          repo_url="https://rubcut.github.io/Paint.QT/repo"
          key_b64="$(gpg --export "${keyid}" | base64 -w0)"

          # The .flatpakrepo a remote is added from: a [Flatpak Repo] group with
          # the title, the location and the key.
          printf '[Flatpak Repo]\nTitle=Paint.QT\nUrl=%s/\nGPGKey=%s\n' \
            "${repo_url}" "${key_b64}" > flatpak-repo/paint-qt.flatpakrepo

          # The flatpakref, cut to the shape Flathub publishes and GNOME Software
          # accepts: one [Flatpak Ref] group and nothing else. The version here
          # carried extra [Runtime] and [Application] sections naming the runtime
          # and the application; flatpak reads past them, but GNOME Software calls
          # such a file invalid, so they are gone rather than left to be argued
          # about. A flatpakref from Flathub has exactly these keys and no
          # sections, so this matches it field for field.
          #
          # Checked here against the live repository: flatpak parses this form,
          # resolves the remote, the runtime and the application.
          printf '[Flatpak Ref]\nName=io.github.RubCut.Paint.QT\nBranch=%s\nTitle=Paint.QT\nIsRuntime=false\nUrl=%s/\nSuggestRemoteName=paintqt\nGPGKey=%s\nRuntimeRepo=%s/paint-qt.flatpakrepo\n' \
            "${branch}" "${repo_url}" "${key_b64}" "${repo_url}" \
            > flatpak-repo/io.github.RubCut.Paint.QT.flatpakref
          cat flatpak-repo/io.github.RubCut.Paint.QT.flatpakref
          test -s flatpak-repo/io.github.RubCut.Paint.QT.flatpakref
          test -s flatpak-repo/paint-qt.flatpakrepo

      # The distribution's flatpak-builder has no --verify, and the run failed on
      # "Option parsing failed: Unknown option --verify". Installing the exported
      # repository and starting the application from it checks more anyway: the
      # commit, the metadata and the bundle all have to be right before flatpak
      # will install anything.
      #
      # A virtual display rather than QT_QPA_PLATFORM=offscreen, because the path
      # a user takes is X11 and that is the one worth exercising.
      - name: Install and start it
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb

          # The key is attached to the remote with --gpg-import, taken from the
          # file the repository itself serves. Importing it into ~/.gnupg by hand
          # is not enough: flatpak verifies a commit against the key configured
          # for the remote, and a file:// remote has none, so it answered "Can't
          # check signature: public key not found" even with the key present.
          #
          # Not --no-gpg-verify, which is one flag shorter and would prove nothing:
          # this way the step only passes if the key we tell users to import really
          # does verify the commit we published.
          flatpak remote-add --user --if-not-exists \
            --gpg-import=flatpak-repo/paint-qt.gpg \
            paintqt-local "file://$PWD/flatpak-repo"
          flatpak install --user -y --no-deps paintqt-local io.github.RubCut.Paint.QT
          xvfb-run -a flatpak run --user io.github.RubCut.Paint.QT --version

      # The branch name is read again rather than carried over: each step is a
      # separate process, so the variable the export step found is not in scope.
      - name: Single-file bundle
        run: |
          set -euo pipefail
          branch=$(find flatpak-repo/refs/heads -type f -printf '%f\n' | head -1)
          test -n "${branch}"
          # LOCATION FILENAME NAME [BRANCH], four arguments. Three were passed,
          # so the branch landed in the NAME slot and flatpak rejected it with
          # "'stable' is not a valid name: Names must contain at least 2 periods".
          # The name is the application id; the branch is the ref's leaf.
          echo "bundling io.github.RubCut.Paint.QT branch ${branch}"
          flatpak build-bundle flatpak-repo paint-qt.flatpak \
            io.github.RubCut.Paint.QT "${branch}"
          ls -la paint-qt.flatpak
          test -s paint-qt.flatpak

      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Published to the gh-pages branch of this repository, not to a separate
          # one. The token a workflow gets is scoped to its own repository, so
          # pushing to RubCut/Paint.QT-repo failed with "Permission to
          # RubCut/Paint.QT-repo.git denied to github-actions[bot]". Serving it
          # from here needs nothing that has to be created by hand.
          #
          # The branch is generated in full every time, so nothing is cloned: the
          # previous contents are replaced, not merged into. Cloning first and
          # then switching to an orphan branch left the step depending on
          # `git checkout --orphan` succeeding, which it refuses whenever the
          # working tree is not empty.
          rm -rf pages-repo
          git init -q -b gh-pages pages-repo
          cd pages-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/flatpak-repo" repo
          # Served verbatim. Without it GitHub Pages runs the tree through
          # Jekyll, and the repository's summary came back 404 while every other
          # file was served. An ostree repository has to be delivered byte for
          # byte, with nothing rewriting or skipping files in it.
          touch .nojekyll

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="utf-8"><title>Paint.QT Flatpak repository</title></head>
          <body><h1>Paint.QT</h1>
          <p>A raster image editor for Linux desktops, in C++20 on Qt 6.</p>
          <p>Install it from a terminal:</p>
          <pre>flatpak install --user --noninteractive --from \
            https://rubcut.github.io/Paint.QT/repo/io.github.RubCut.Paint.QT.flatpakref</pre>
          <p>Or in a software centre: this URL is a flatpakref, which is what
          GNOME Software and KDE Discover read.</p>
          <p><a href="https://rubcut.github.io/Paint.QT/repo/io.github.RubCut.Paint.QT.flatpakref">The flatpakref</a>
          &middot; <a href="https://rubcut.github.io/Paint.QT/repo/paint-qt.flatpakrepo">Add the repository yourself</a>
          &middot; <a href="https://rubcut.github.io/Paint.QT/repo/paint-qt.gpg">The signing key</a></p>
          <p><a href="https://github.com/RubCut/Paint.QT">Source</a>
          &middot; <a href="https://github.com/RubCut/Paint.QT/releases">Downloads</a></p></body></html>
          EOF
          git add -A
          git commit -q -m "Update the Flatpak repository"
          # Forced, and it has to be: this commit is built from an empty
          # repository, so it shares no history with the branch already published
          # and an ordinary push is rejected as a non-fast-forward. Replacing the
          # branch is the intent, since everything in it is generated.
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            gh-pages

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: |
            paint-qt.flatpak
            flatpak-repo/io.github.RubCut.Paint.QT.flatpakref
            flatpak-repo/paint-qt.flatpakrepo
            flatpak-repo/paint-qt.gpg

  arch:
    name: Arch (PKGBUILD)
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      # base-devel brings the compiler and the headers: the archlinux:latest
      # container is deliberately minimal, so without it CMake finds no C++
      # compiler at all. makepkg also needs fakeroot to run and core/debugedit to
      # produce the package, and makepkg refuses to run as root, which a
      # container job is.
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja qt6-base qt6-svg fakeroot core/debugedit

      # The PKGBUILD fetches the release tarball, which does not exist before a
      # tag is pushed. Rather than rewriting the recipe with sed, which would
      # test a PKGBUILD nobody ships, lay the sources out the way makepkg expects
      # an unpacked tarball and empty only the source list, so the recipe is
      # exercised verbatim.
      - name: Lay out the sources like an unpacked tarball
        run: |
          version=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          # Stage outside src/ first: copying src/ into src/paint-qt-$version/
          # is a copy of a directory into itself, which cp refuses.
          staging=$(mktemp -d)
          cp -r src tools tests packaging CMakeLists.txt LICENSE README.md "$staging/"
          mkdir -p src
          # Named after the repository, because that is what GitHub's archive
          # unpacks to and what _srcdir in the PKGBUILD now expects. Staging it
          # as paint-qt-${version} built a tree the recipe could not find, which
          # is what the recipe itself got wrong before.
          mv "$staging" "src/Paint.QT-${version}"
          cp packaging/aur/PKGBUILD .
          sed -i 's|^source=.*|source=()|; s|^sha256sums=.*|sha256sums=()|' PKGBUILD
          grep -E '^(pkgver|source|sha256sums)=' PKGBUILD

      - name: Build the package
        run: |
          useradd --create-home --shell /bin/bash builder
          chown -R builder:builder "$PWD"
          su builder -c 'cd "'"$PWD"'" && makepkg -s --noconfirm --nodeps'
          chown -R "$(id -u):$(id -g)" "$PWD" || true

      - name: Inspect the package
        run: |
          pkg=$(ls ./*.pkg.tar.zst 2>/dev/null | grep -v debug | head -1)
          if [ -z "${pkg}" ]; then echo "no package was produced"; exit 1; fi
          echo "Built ${pkg}"
          bsdtar -tf "${pkg}" | grep -q 'usr/bin/paint-qt'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/applications/io.github.RubCut.Paint.QT.desktop'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/icons/hicolor/scalable/apps/io.github.RubCut.Paint.QT.svg'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/metainfo/io.github.RubCut.Paint.QT.metainfo.xml'
          bsdtar -tf "${pkg}" | grep -q 'usr/share/licenses/paint-qt/LICENSE'
